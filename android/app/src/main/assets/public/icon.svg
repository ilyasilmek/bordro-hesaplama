<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#dc2626" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Document / Payroll Sheet Plate -->
  <rect x="116" y="96" width="280" height="320" rx="24" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.4))"/>
  
  <!-- Document Header Bar (Red TCDD Brand) -->
  <path d="M 116 120 C 116 106.7 126.7 96 140 96 L 372 96 C 385.3 96 396 106.7 396 120 L 396 160 L 116 160 Z" fill="url(#accentGrad)"/>
  
  <!-- TCDD text in header -->
  <text x="256" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" letter-spacing="4" text-anchor="middle">TCDD</text>

  <!-- Train / High-speed Front Silhouette in Document Body -->
  <g transform="translate(196, 180) scale(0.24)">
    <path d="M250 50 C180 50 120 100 110 180 L80 340 C75 370 100 400 130 400 L370 400 C400 400 425 370 420 340 L390 180 C380 100 320 50 250 50 Z" fill="#0f172a"/>
    <!-- Windshield -->
    <path d="M250 100 C200 100 160 130 150 180 L350 180 C340 130 300 100 250 100 Z" fill="#38bdf8"/>
    <!-- Train Lights -->
    <circle cx="160" cy="330" r="28" fill="#facc15"/>
    <circle cx="340" cy="330" r="28" fill="#facc15"/>
    <!-- Grill Lines -->
    <rect x="210" y="320" width="80" height="12" rx="6" fill="#64748b"/>
    <rect x="220" y="344" width="60" height="10" rx="5" fill="#64748b"/>
  </g>

  <!-- Payroll Calculation Lines -->
  <rect x="156" y="296" width="200" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="156" y="324" width="130" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="306" y="324" width="50" height="14" rx="7" fill="#16a34a"/>
  
  <rect x="156" y="352" width="90" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="266" y="352" width="90" height="14" rx="7" fill="#dc2626"/>

  <rect x="156" y="380" width="200" height="18" rx="9" fill="#0284c7"/>
</svg>
